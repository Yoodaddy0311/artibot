name: Plugin Validation

on:
  push:
    paths:
      - "plugins/artibot/.claude-plugin/plugin.json"
      - "plugins/artibot/agents/**"
      - "plugins/artibot/skills/**"
      - "plugins/artibot/commands/**"
      - "plugins/artibot-cowork/.claude-plugin/plugin.json"
      - "plugins/artibot-cowork/agents/**"
      - "plugins/artibot-cowork/skills/**"
      - "plugins/artibot-cowork/commands/**"
      - ".github/workflows/plugin-validate.yml"
  # Note: no `paths` filter on pull_request. The two matrix jobs are listed
  # as required checks in master's branch protection, so a PR that doesn't
  # touch plugin/agent/skill/command files (e.g. README-only, workflow-only)
  # would otherwise stay BLOCKED forever — the required check never runs and
  # never reports a status. The validation itself is fast (~10s per matrix
  # leg), so the cost of always running is negligible.
  #
  # `push` keeps its paths filter because direct pushes to master are blocked
  # by branch protection anyway, and feature-branch pushes get covered by
  # the PR's pull_request trigger.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fast-skip detector: docs-only / workflow-only PRs do not touch plugin
  # assets, but plugin-structure is a required check so it must still report.
  # We compute a "plugin_changed" flag here in ~5s and let plugin-structure
  # short-circuit when the flag is false. The required check still reports
  # success, but the matrix avoids redundant Node setup + validation passes.
  fast-skip:
    name: Detect plugin-asset changes
    runs-on: ubuntu-latest
    outputs:
      plugin_changed: ${{ steps.detect.outputs.plugin_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect plugin changes
        id: detect
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "plugin_changed=true" >> "$GITHUB_OUTPUT"
            echo "Non-PR event — full validation."
            exit 0
          fi
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          if ! CHANGED=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}" 2>/dev/null); then
            echo "plugin_changed=true" >> "$GITHUB_OUTPUT"
            echo "git diff failed — falling back to full validation."
            exit 0
          fi
          if echo "$CHANGED" | grep -qE '^(plugins/artibot(-cowork)?/(\.claude-plugin/plugin\.json|agents/|skills/|commands/)|\.github/workflows/plugin-validate\.yml)'; then
            echo "plugin_changed=true" >> "$GITHUB_OUTPUT"
            echo "Plugin assets changed — full validation."
          else
            echo "plugin_changed=false" >> "$GITHUB_OUTPUT"
            echo "Docs/workflow-only PR — fast-skip enabled."
          fi

  plugin-structure:
    name: Validate ${{ matrix.plugin }} plugin.json structure
    needs: fast-skip
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        plugin: [artibot, artibot-cowork]

    defaults:
      run:
        working-directory: plugins/${{ matrix.plugin }}

    steps:
      - name: Fast-skip notice
        if: needs.fast-skip.outputs.plugin_changed == 'false'
        run: echo "PR touched no plugin assets — validation skipped (required check still reports green)."

      - name: Checkout repository
        if: needs.fast-skip.outputs.plugin_changed == 'true'
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        if: needs.fast-skip.outputs.plugin_changed == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate plugin.json schema
        if: needs.fast-skip.outputs.plugin_changed == 'true'
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');

          const pluginPath = '.claude-plugin/plugin.json';
          if (!fs.existsSync(pluginPath)) {
            console.error('FAIL: .claude-plugin/plugin.json not found');
            process.exit(1);
          }

          let plugin;
          try {
            plugin = JSON.parse(fs.readFileSync(pluginPath, 'utf-8'));
          } catch (e) {
            console.error('FAIL: plugin.json is not valid JSON:', e.message);
            process.exit(1);
          }

          const required = ['name', 'version', 'description'];
          let errors = 0;

          for (const field of required) {
            if (!plugin[field]) {
              console.error('FAIL: Missing required field:', field);
              errors++;
            }
          }

          // Validate version format (semver)
          const semverRegex = /^\d+\.\d+\.\d+(-[\w.]+)?$/;
          if (plugin.version && !semverRegex.test(plugin.version)) {
            console.error('FAIL: Invalid version format:', plugin.version);
            errors++;
          }

          if (errors > 0) {
            process.exit(1);
          }
          console.log('PASS: plugin.json schema is valid');
          console.log('  name:', plugin.name);
          console.log('  version:', plugin.version);
          "

      - name: Validate agent file references
        if: needs.fast-skip.outputs.plugin_changed == 'true'
        run: |
          node -e "
          const fs = require('fs');
          const plugin = JSON.parse(fs.readFileSync('.claude-plugin/plugin.json', 'utf-8'));

          if (!plugin.agents || !Array.isArray(plugin.agents)) {
            console.log('No agents array in plugin.json. Skipping.');
            process.exit(0);
          }

          let errors = 0;
          for (const agentRef of plugin.agents) {
            const agentPath = agentRef.replace(/^\.\//, '');
            if (!fs.existsSync(agentPath)) {
              console.error('FAIL: Agent file not found:', agentRef, '->', agentPath);
              errors++;
            } else {
              console.log('PASS:', agentRef);
            }
          }

          if (errors > 0) {
            console.error('\n' + errors + ' agent reference(s) broken.');
            process.exit(1);
          }
          console.log('\nAll ' + plugin.agents.length + ' agent reference(s) valid.');
          "

      - name: Validate skills directory structure
        if: needs.fast-skip.outputs.plugin_changed == 'true'
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');

          const plugin = JSON.parse(fs.readFileSync('.claude-plugin/plugin.json', 'utf-8'));
          // plugin.skills is an array of paths per Claude Code plugin schema.
          // Normalize to a single directory string (use first entry, or default).
          const skillsRaw = Array.isArray(plugin.skills) ? plugin.skills[0] : plugin.skills;
          const skillsDir = (skillsRaw || './skills').replace(/^\.\//, '').replace(/\/\$/, '');

          if (!fs.existsSync(skillsDir)) {
            console.log('Skills directory not found:', skillsDir, '- Skipping.');
            process.exit(0);
          }

          const entries = fs.readdirSync(skillsDir).filter(e =>
            fs.statSync(path.join(skillsDir, e)).isDirectory()
          );

          let errors = 0;
          for (const dir of entries) {
            const skillMd = path.join(skillsDir, dir, 'SKILL.md');
            if (!fs.existsSync(skillMd)) {
              console.error('FAIL: skills/' + dir + '/ missing SKILL.md');
              errors++;
            } else {
              console.log('PASS: skills/' + dir + '/SKILL.md exists');
            }
          }

          if (errors > 0) {
            console.error('\n' + errors + ' skill directory structure error(s).');
            process.exit(1);
          }
          console.log('\nAll ' + entries.length + ' skill directories valid.');
          "

      - name: Validate commands directory
        if: needs.fast-skip.outputs.plugin_changed == 'true'
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');

          const plugin = JSON.parse(fs.readFileSync('.claude-plugin/plugin.json', 'utf-8'));
          // plugin.commands is an array of paths per Claude Code plugin schema.
          const cmdsRaw = Array.isArray(plugin.commands) ? plugin.commands[0] : plugin.commands;
          const cmdsDir = (cmdsRaw || './commands').replace(/^\.\//, '').replace(/\/\$/, '');

          if (!fs.existsSync(cmdsDir)) {
            console.log('Commands directory not found:', cmdsDir, '- Skipping.');
            process.exit(0);
          }

          const files = fs.readdirSync(cmdsDir).filter(f => f.endsWith('.md'));
          let errors = 0;

          for (const file of files) {
            const content = fs.readFileSync(path.join(cmdsDir, file), 'utf-8');
            const hasFrontmatter = /^---\r?\n[\s\S]*?\r?\n---/.test(content);

            if (!hasFrontmatter) {
              console.error('FAIL: commands/' + file + ' missing YAML frontmatter');
              errors++;
            } else {
              console.log('PASS: commands/' + file);
            }
          }

          if (errors > 0) {
            console.error('\n' + errors + ' command file error(s).');
            process.exit(1);
          }
          console.log('\nAll ' + files.length + ' command files valid.');
          "
