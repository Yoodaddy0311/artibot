name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate before release
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: plugins/artibot

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/artibot/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts || npm install

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PLUGIN_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json','utf-8')).version)")
          if [ "$TAG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match plugin.json version ($PLUGIN_VERSION)"
            exit 1
          fi
          echo "Version verified: $TAG_VERSION"

      - name: Validate agents
        run: node scripts/ci/validate-agents.js

      - name: Validate skills
        run: node scripts/ci/validate-skills.js

      - name: Validate commands
        run: node scripts/ci/validate-commands.js

      - name: Validate hooks
        run: node scripts/ci/validate-hooks.js

      - name: Run tests
        run: |
          if [ -d "tests" ] || [ -d "__tests__" ] || [ -d "test" ]; then
            npx vitest run --reporter=verbose
          else
            echo "No test directory found. Skipping tests."
          fi

  release:
    name: Create GitHub Release
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | head -n 2 | tail -n 1)
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$GITHUB_REF_NAME" ]; then
            CHANGES=$(git log --pretty=format:"- %s (%h)" --no-merges HEAD~20..HEAD)
          else
            CHANGES=$(git log --pretty=format:"- %s (%h)" --no-merges "${PREV_TAG}..${GITHUB_REF_NAME}")
          fi

          {
            echo "changes<<CHANGES_EOF"
            echo "$CHANGES"
            echo "CHANGES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Artibot ${{ github.ref_name }}
          body: |
            ## Artibot ${{ github.ref_name }}

            ### Changes
            ${{ steps.changelog.outputs.changes }}

            ---
            *Claude Code Agent Teams Orchestration Plugin*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          generate_release_notes: true

  sync-readmes:
    name: Sync README badges
    needs: release
    # Only run on stable releases (skip rc/beta/alpha pre-releases)
    if: ${{ !contains(github.ref_name, '-rc') && !contains(github.ref_name, '-beta') && !contains(github.ref_name, '-alpha') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Compute counts
        id: counts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          AGENTS=$(find plugins/artibot/agents -maxdepth 1 -type f -name '*.md' | wc -l | tr -d ' ')
          COMMANDS=$(find plugins/artibot/commands -maxdepth 1 -type f -name '*.md' | wc -l | tr -d ' ')
          SKILLS=$(find plugins/artibot/skills -maxdepth 1 -mindepth 1 -type d | wc -l | tr -d ' ')
          TESTS=$(find plugins/artibot/tests -type f \( -name '*.test.js' -o -name '*.spec.js' \) | wc -l | tr -d ' ')
          {
            echo "version=${VERSION}"
            echo "agents=${AGENTS}"
            echo "commands=${COMMANDS}"
            echo "skills=${SKILLS}"
            echo "tests=${TESTS}"
          } >> "$GITHUB_OUTPUT"
          echo "Computed: v${VERSION} | agents=${AGENTS} commands=${COMMANDS} skills=${SKILLS} tests=${TESTS}"

      - name: Update version badges in READMEs
        env:
          VERSION: ${{ steps.counts.outputs.version }}
        run: |
          # NOTE on sed regex hygiene: GNU sed in -E (ERE) mode treats \| as
          # alternation, NOT as a literal pipe. The previous version of this
          # script used \| inside the artibot-row anchor and the regex
          # degenerated to (alt1|alt2|" ")\*\*X.Y.Z\*\* — matching every
          # `**X.Y.Z**` token in the file (including the cowork row and the
          # version-history bullets). Fix: use # as the s-delimiter (so | is
          # never special to sed) AND express literal pipes as [|] inside the
          # pattern (so GNU's ERE alternation extension cannot grab them).
          #
          # Both README badges: shields.io version-X.Y.Z-blue
          sed -i -E "s#version-[0-9]+\.[0-9]+\.[0-9]+-blue#version-${VERSION}-blue#g" README.md
          sed -i -E "s#version-[0-9]+\.[0-9]+\.[0-9]+-blue#version-${VERSION}-blue#g" plugins/artibot/README.md
          # Root README plugin table row — scoped to artibot row only.
          sed -i -E "s#(\[\`artibot\`\]\(\./plugins/artibot/\) [|] Claude Code \(developer CLI\) [|] )\*\*[0-9]+\.[0-9]+\.[0-9]+\*\*#\1**${VERSION}**#" README.md

      - name: Commit and push README updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md plugins/artibot/README.md
          if git diff --cached --quiet; then
            echo "No README changes to commit."
            exit 0
          fi
          git commit -m "docs(release): sync README badges to ${GITHUB_REF_NAME} [skip ci]"
          git push origin master
