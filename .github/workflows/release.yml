name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Single source of truth for the escalation issue titles. The `sync-readmes`
# job below can open four different issues, and every one of them now has a
# closing half in `Close resolved badge-sync escalation issues`: the opener
# writes the title, the closer finds those issues again once the badge sync has
# landed. Written literally in both places they would drift on the first reword
# and the closer would silently stop matching — which is the same class of
# unobservable failure the detector itself exists to fix.
#
# Split into prefix/suffix rather than a single format string because the closer
# has to run the substitution BACKWARDS: it recovers the tag from an existing
# issue title, which `printf '…%s…'` cannot do.
#
# MERGE_TITLE_PREFIX is byte-identical to STALL_TITLE_PREFIX today. They are
# kept as two names on purpose: they belong to two independent issues opened by
# two different steps, and collapsing them would mean rewording one could not be
# done without rewording the other. The `case` in the closer disambiguates on
# the suffix, which is unique per kind.
env:
  # Opened by `Detect silent badge-sync stall` (PR mode): auto-merge is on but
  # the required checks were never created, so it can never fire.
  STALL_TITLE_PREFIX: "chore(release): badge-sync PR "
  STALL_TITLE_SUFFIX: " is stalled — required checks never started"
  # Opened by `Land badge sync via ci/** side branch (PAT)` (ff mode) on any of
  # its six failure paths — push rejected, checks not green, fetch failed,
  # rebase conflicted, force-with-lease refused, retry exhausted.
  LAND_TITLE_PREFIX: "chore(release): badge sync "
  LAND_TITLE_SUFFIX: " could not land on master"
  # Opened by `Land badge sync via PR + auto-merge` (PR mode) when the branch
  # push itself was rejected, so no PR was ever created.
  PUSH_TITLE_PREFIX: "chore(release): badge-sync branch "
  PUSH_TITLE_SUFFIX: " could not be pushed"
  # Opened by `Land badge sync via PR + auto-merge` (PR mode) when the PR exists
  # but `gh pr merge --auto` was refused.
  MERGE_TITLE_PREFIX: "chore(release): badge-sync PR "
  MERGE_TITLE_SUFFIX: " needs manual merge"
  # Branch names are a second single source of truth for the same reason: the
  # closer has to reconstruct the branch a given issue is about, and a producer
  # that reworded its branch name would leave the closer querying a name that
  # never existed — again with no error, just an issue that stops being closed.
  FF_BRANCH_PREFIX: "ci/sync-badges-"
  PR_BRANCH_PREFIX: "chore/sync-readme-badges-"

jobs:
  validate:
    name: Validate before release
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: plugins/artibot

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/artibot/package-lock.json

      - name: Install dependencies
        # The fallback keeps --ignore-scripts. Without it, `npm ci` failing (a
        # lockfile that has drifted from package.json is the usual cause) would
        # silently downgrade to an install that DOES run lifecycle scripts —
        # arbitrary preinstall/postinstall code from the dependency tree, on a
        # runner holding a write-scoped token. The flag exists to prevent that,
        # so the degraded path is exactly where it must not be dropped.
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PLUGIN_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json','utf-8')).version)")
          if [ "$TAG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match plugin.json version ($PLUGIN_VERSION)"
            exit 1
          fi
          echo "Version verified: $TAG_VERSION"

      # Lockstep version gate — fail the release if any file in the version
      # lockstep set (plugin.json, package.json, both marketplace.json files,
      # README badges, AGENTS.md, mcp-server.json) has drifted. This is the
      # gate that, while unwired, let a marketplace lockstep miss ship.
      # --no-sync-check skips the ~/.claude/artibot install-drift check, which
      # is irrelevant on a fresh CI runner (and would only ever warn, exit 2).
      - name: Verify lockstep versions (release-check)
        run: node scripts/release-check.js --no-sync-check

      # marketplace.json metadata drift gate. No standalone marketplace-validate
      # script exists; sync-marketplace-meta.mjs --check is the authoritative
      # dry-run that exits non-zero when marketplace version / release.current
      # drift from plugin.json.
      - name: Verify marketplace metadata (no drift)
        run: node scripts/ci/sync-marketplace-meta.mjs --check

      - name: Validate agents
        run: node scripts/ci/validate-agents.js

      - name: Validate skills
        run: node scripts/ci/validate-skills.js

      - name: Validate commands
        run: node scripts/ci/validate-commands.js

      - name: Validate hooks
        run: node scripts/ci/validate-hooks.js

      # The tag-time vitest run is informational only. The authoritative
      # quality gate is the CI run on the master branch that produced the
      # commit being tagged (every PR into master must pass CI before merge).
      # By the time a tag is pushed, that gate has already been cleared.
      #
      # Why not block on this run: tag-pinned vitest runs commit-time code,
      # which often diverges from the OS-environment / flaky-test landscape
      # at tag push time (e.g. v4.8.x and v4.11.x both failed this step on
      # a legacy stop-review-gate over-specification that was later fixed in
      # master — see PR #20). Blocking the GitHub Release on flaky tag-time
      # tests previously left v4.8.0..v4.8.3 / v4.11.0 / v4.11.1 without
      # auto-generated releases and forced manual `gh release create`. This
      # step now surfaces failures as a warning (red ✗ on the step) without
      # blocking the release job.
      - name: Run tests (informational)
        continue-on-error: true
        run: |
          if [ -d "tests" ] || [ -d "__tests__" ] || [ -d "test" ]; then
            npx vitest run --reporter=verbose
          else
            echo "No test directory found. Skipping tests."
          fi

  release:
    name: Create GitHub Release
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | head -n 2 | tail -n 1)
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$GITHUB_REF_NAME" ]; then
            CHANGES=$(git log --pretty=format:"- %s (%h)" --no-merges HEAD~20..HEAD)
          else
            CHANGES=$(git log --pretty=format:"- %s (%h)" --no-merges "${PREV_TAG}..${GITHUB_REF_NAME}")
          fi

          {
            echo "changes<<CHANGES_EOF"
            echo "$CHANGES"
            echo "CHANGES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: Artibot ${{ github.ref_name }}
          body: |
            ## Artibot ${{ github.ref_name }}

            ### Changes
            ${{ steps.changelog.outputs.changes }}

            ---
            *Claude Code Agent Teams Orchestration Plugin*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          generate_release_notes: true

  sync-readmes:
    name: Sync README badges
    needs: release
    # Only run on stable releases (skip rc/beta/alpha pre-releases)
    if: ${{ !contains(github.ref_name, '-rc') && !contains(github.ref_name, '-beta') && !contains(github.ref_name, '-alpha') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Required by the `gh issue create` escalation paths below. A job-level
      # `permissions:` block REPLACES the workflow-level one (`:8-9`, which
      # grants only `contents: write`) instead of merging with it, so until this
      # line existed the escalation could not have opened an issue under any
      # circumstance.
      #
      # "존재 ≠ 작동": that escalation has been present in code since the badge-PR
      # flow was introduced and has never once succeeded. It is invisible in the
      # logs because it only fires when `gh pr merge --auto` FAILS, and that call
      # kept succeeding — the stall happened one step later, waiting on required
      # checks that were never created. Measured 2026-08-15: this repo has
      # exactly one issue in its entire history (#33, 2026-05-21), confirming no
      # escalation issue has ever been opened.
      issues: write
      # Read scopes for the stall detector's two queries. Same rule as above: a
      # job-level `permissions:` block enumerates the ENTIRE grant, so any scope
      # not listed here is no-access — `actions/runs` needs `actions: read` and
      # `commits/<sha>/check-runs` needs `checks: read`.
      #
      # Not proven to have been failing: this repo is public (measured
      # 2026-08-15 `gh repo view` -> visibility PUBLIC), and public resources are
      # often readable regardless of the grant, so the detector might have worked
      # by accident. Granting the scopes explicitly removes the dependency on
      # that accident — and on the repo staying public.
      actions: read
      checks: read

    steps:
      - name: Checkout master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Escalation-issue self-heal ─────────────────────────────────────────
      # The detector at the end of this job opens an issue when a badge PR
      # cannot merge. Nothing ever closed those issues: #107 (v4.48.0) and #109
      # (v4.49.0) were still open on 2026-08-24 even though their PRs (#106,
      # #108) had merged on 08-22 and 08-23. This step is the missing half.
      #
      # Four kinds of escalation issue are reconciled here, each with its own
      # observable resolution. The kinds differ in which branch carries the
      # badge sync and therefore in what "it landed" can even be measured from:
      #
      #   kind   opened when                        branch                landed when
      #   ─────  ─────────────────────────────────  ────────────────────  ──────────────────────────
      #   stall  auto-merge on, no required checks  PR_BRANCH_PREFIX+tag  a PR on it merged
      #   merge  `gh pr merge --auto` refused       PR_BRANCH_PREFIX+tag  a PR on it merged
      #   push   branch push rejected (re-tag)      PR_BRANCH_PREFIX+tag  a PR on it merged
      #   land   ff path failed (any of six ways)   FF_BRANCH_PREFIX+tag  a PR on it merged, OR the
      #                                                                   branch is contained in master
      #
      # `land` needs the second signal because the ff path never opens a PR — it
      # fast-forwards master onto the branch directly and does not delete the
      # branch afterwards, so containment in master is the only trace a
      # successful landing leaves behind. The REST compare endpoint reports that
      # as status `identical` (master is exactly the branch) or `behind` (master
      # has since moved on past it); `ahead` and `diverged` both mean the branch
      # carries commits master does not. The merged-PR signal is kept too, because a
      # human resolving it by hand may well open a PR from that branch, and a
      # squash merge would break containment while still meaning it landed.
      #
      # `push` is the one case where the escalation can be resolved by work that
      # happened BEFORE the issue was opened: the push is rejected because a
      # branch of that name already exists from an earlier tagging attempt, and
      # that attempt's PR may already have merged. Closing it on the next
      # release is right, but NOT because the two syncs carry identical
      # content — only the version half is tag-derived. `Compute counts` reads
      # VERSION from GITHUB_REF_NAME, i.e. from the tag; the four badge counts
      # come from `find` over the tree that `Checkout master` just checked out,
      # i.e. from master AT RUN TIME. So if master moved between the two
      # tagging attempts, the already-merged PR carried different counts than
      # this run computed, and closing the issue hides "this run's numbers
      # never landed". Accepted, for the same reason the latency entry below
      # is: the next stable release recomputes and re-syncs the counts, so the
      # divergence lives at most one release.
      #
      # Why it lives in the release run and NOT on a `pull_request: closed`
      # trigger, which is the obvious answer: measured 2026-08-24, both badge
      # PRs were merged by `app/github-actions` via auto-merge, and GitHub does
      # not create workflow runs for events attributed to GITHUB_TOKEN.
      # `actions/runs?head_sha=` returned total_count 0 for #106's merge commit
      # 572e9d19 and 1 for #108's 33deadbc — and that single run was a
      # `schedule` run of Self-Control, not a push or pull_request run. A
      # `pull_request: closed` closer would therefore never fire for the exact
      # case it exists to handle: it would look correct in review, produce no
      # error, and do nothing. Tag pushes are human-authored, so this run is the
      # nearest trigger that is actually guaranteed to happen.
      #
      # What this gate does NOT cover (rules §9 — write down what the gate
      # cannot see, next to the gate):
      #   - Latency. The issue stays open until the NEXT stable release runs,
      #     bounding the backlog at one open issue rather than closing at merge
      #     time. Closing on merge needs a trigger that fires without a human;
      #     a `schedule:` cron in its own workflow is the upgrade path if that
      #     latency ever starts to matter.
      #   - Pre-releases. The `sync-readmes` job's own `if:` skips -rc/-beta/
      #     -alpha tags, so a backlog of stalled issues would not be reconciled
      #     until the next stable tag.
      #   - Issues whose title was hand-edited after the fact no longer match
      #     the prefix/suffix and are left alone. Deliberate: closing on a fuzzy
      #     match would be worse than leaving a human-owned issue open.
      #   - Anything past the first 100 open issues. `gh issue list --limit 100`
      #     is not paginated below, so a repo carrying more than 100 open issues
      #     could hide a stall issue from this pass entirely. Harmless today
      #     (measured 2026-08-24: this repo has had 3 issues in its whole
      #     history) and it fails closed — an unseen issue simply stays open.
      #   - A badge sync landed by a route that touches neither the branch nor a
      #     PR from it — someone committing the four files to master by hand, or
      #     cherry-picking them onto a differently named branch. Nothing here
      #     observes that, so the issue stays open for a human to close. This is
      #     the deliberate fail-closed direction, not an oversight.
      #   - A `land` issue whose branch was never pushed at all (the first of
      #     the ff path's six failure paths). `compare` 404s on a branch that
      #     does not exist, which reads as "not landed" — correct by accident
      #     here, since the sync genuinely never left the runner.
      #
      # Placed immediately after the checkout, before the badge computation
      # steps, so a failure in those cannot leave last release's issue open too.
      - name: Close resolved badge-sync escalation issues
        # The GitHub Release is already published by the time this job runs, so
        # a reconciliation bug must never fail the workflow.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A failed query and a genuine zero must not collapse to the same
          # value — the same rule the detector step below records at length.
          # `2>/dev/null || true` would have reported an auth failure or an API
          # outage as "nothing to reconcile" and exited green, which is the
          # unobservable silence both steps exist to remove.
          ERR_LOG="$(mktemp)"
          trap 'rm -f "${ERR_LOG}"' EXIT
          if ! open_issues="$(gh issue list --state open --limit 100 --json number,title \
            --jq '.[] | [.number, .title] | @tsv' 2>"${ERR_LOG}")"; then
            echo "::warning::Could not list open issues, so no escalation issue was reconciled this run: $(tr '\n' ' ' < "${ERR_LOG}" | cut -c1-300)"
            exit 0
          fi
          if [ -z "${open_issues}" ]; then
            echo "No open issues to reconcile."
            exit 0
          fi

          # Which `compare` verdicts mean the branch reached master. An
          # allowlist, not a denylist: a denylist is fail-OPEN on any status
          # GitHub adds later (rules §8), and failing open here means closing an
          # issue whose badge sync never landed. The four statuses the API can
          # return today are identical / behind / ahead / diverged; only the
          # first two mean every commit on the branch is already in master.
          LANDED_COMPARE_STATUSES="identical behind"

          printf '%s\n' "${open_issues}" | while IFS="$(printf '\t')" read -r number title; do
            # Quoted patterns are literal in a `case` arm; only the bare `*` is
            # a glob. Matching on both ends keeps an unrelated issue that merely
            # starts with the prefix out of the closer — which matters more now
            # that two kinds share a prefix byte-for-byte: `stall` and `merge`
            # are told apart by the suffix alone.
            case "${title}" in
              "${STALL_TITLE_PREFIX}"*"${STALL_TITLE_SUFFIX}")
                kind="stall"
                tag="${title#"${STALL_TITLE_PREFIX}"}"
                tag="${tag%"${STALL_TITLE_SUFFIX}"}"
                branch="${PR_BRANCH_PREFIX}${tag}" ;;
              "${MERGE_TITLE_PREFIX}"*"${MERGE_TITLE_SUFFIX}")
                kind="merge"
                tag="${title#"${MERGE_TITLE_PREFIX}"}"
                tag="${tag%"${MERGE_TITLE_SUFFIX}"}"
                branch="${PR_BRANCH_PREFIX}${tag}" ;;
              "${PUSH_TITLE_PREFIX}"*"${PUSH_TITLE_SUFFIX}")
                kind="push"
                tag="${title#"${PUSH_TITLE_PREFIX}"}"
                tag="${tag%"${PUSH_TITLE_SUFFIX}"}"
                branch="${PR_BRANCH_PREFIX}${tag}" ;;
              "${LAND_TITLE_PREFIX}"*"${LAND_TITLE_SUFFIX}")
                kind="land"
                tag="${title#"${LAND_TITLE_PREFIX}"}"
                tag="${tag%"${LAND_TITLE_SUFFIX}"}"
                branch="${FF_BRANCH_PREFIX}${tag}" ;;
              *) continue ;;
            esac

            # `--state merged` is the whole verdict for the three PR-mode kinds:
            # an issue is only resolved when the badge changes actually reached
            # master. A closed-unmerged PR means someone discarded the sync,
            # which is still a thing a human needs to know about, so that issue
            # stays open.
            #
            # This query is allowed to swallow its failure, unlike the issue
            # list above, because the two fail in opposite directions: an
            # unanswered `pr list` yields an empty `merged_at`, which leaves the
            # issue OPEN. Failing closed on a per-issue query costs one stale
            # issue until the next release; failing open would close an issue
            # reporting a stall that is still happening.
            merged_at="$(gh pr list --head "${branch}" --state merged --limit 1 \
              --json mergedAt --jq '.[0].mergedAt // empty' 2>/dev/null || true)"
            resolution=""
            if [ -n "${merged_at}" ]; then
              resolution="a PR on \`${branch}\` merged at ${merged_at}"
            elif [ "${kind}" = "land" ]; then
              # ff mode never opens a PR, so containment in master is the only
              # trace a successful landing leaves. Same swallow-and-fail-closed
              # rule as the query above: an unanswered `compare` (or a 404 for a
              # branch that was never pushed) yields an empty status, which
              # matches nothing in the allowlist and leaves the issue open.
              compare_status="$(gh api \
                "repos/${GITHUB_REPOSITORY}/compare/master...${branch}" \
                --jq '.status' 2>/dev/null || true)"
              # An empty status expands to two adjacent spaces, which the
              # single-spaced allowlist cannot contain — so "query failed" and
              # "not landed" both fall through to the leave-open branch.
              case " ${LANDED_COMPARE_STATUSES} " in
                *" ${compare_status} "*)
                  resolution="\`${branch}\` is contained in master (compare status \`${compare_status}\`)" ;;
              esac
            fi

            if [ -z "${resolution}" ]; then
              echo "Issue #${number} (${kind} ${tag}): no landing evidence on ${branch} — leaving open."
              continue
            fi
            echo "Issue #${number} (${kind} ${tag}): ${resolution} — closing."
            gh issue close "${number}" \
              --comment "Badge sync for ${tag} landed on master (${resolution}), so the problem reported here is resolved. Closed automatically by the ${GITHUB_REF_NAME} release run." \
              || echo "::warning::Could not close resolved escalation issue #${number}"
          done
          echo "Stall-issue reconciliation complete."

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Compute counts
        id: counts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          AGENTS=$(find plugins/artibot/agents -maxdepth 1 -type f -name '*.md' | wc -l | tr -d ' ')
          COMMANDS=$(find plugins/artibot/commands -maxdepth 1 -type f -name '*.md' | wc -l | tr -d ' ')
          SKILLS=$(find plugins/artibot/skills -maxdepth 1 -mindepth 1 -type d | wc -l | tr -d ' ')
          # TESTFILES = number of test *files* (README badge granularity).
          TESTFILES=$(find plugins/artibot/tests -type f \( -name '*.test.js' -o -name '*.spec.js' \) | wc -l | tr -d ' ')
          {
            echo "version=${VERSION}"
            echo "agents=${AGENTS}"
            echo "commands=${COMMANDS}"
            echo "skills=${SKILLS}"
            echo "testfiles=${TESTFILES}"
          } >> "$GITHUB_OUTPUT"
          echo "Computed: v${VERSION} | agents=${AGENTS} commands=${COMMANDS} skills=${SKILLS} testfiles=${TESTFILES}"

      - name: Update version badges in READMEs
        env:
          VERSION: ${{ steps.counts.outputs.version }}
        run: |
          # NOTE on sed regex hygiene: GNU sed in -E (ERE) mode treats \| as
          # alternation, NOT as a literal pipe. The previous version of this
          # script used \| inside the artibot-row anchor and the regex
          # degenerated to (alt1|alt2|" ")\*\*X.Y.Z\*\* — matching every
          # `**X.Y.Z**` token in the file (including the cowork row and the
          # version-history bullets). Fix: use # as the s-delimiter (so | is
          # never special to sed) AND express literal pipes as [|] inside the
          # pattern (so GNU's ERE alternation extension cannot grab them).
          #
          # Both README badges: shields.io version-X.Y.Z-blue
          sed -i -E "s#version-[0-9]+\.[0-9]+\.[0-9]+-blue#version-${VERSION}-blue#g" README.md
          sed -i -E "s#version-[0-9]+\.[0-9]+\.[0-9]+-blue#version-${VERSION}-blue#g" plugins/artibot/README.md
          # Root README plugin table row — scoped to artibot row only.
          sed -i -E "s#(\[\`artibot\`\]\(\./plugins/artibot/\) [|] Claude Code \(developer CLI\) [|] )\*\*[0-9]+\.[0-9]+\.[0-9]+\*\*#\1**${VERSION}**#" README.md

      - name: Sync README count prose
        # Self-heal count prose ("N slash commands", "N skills", …) so a release
        # that changes a count never leaves drift for the validate-readme-claims
        # gate to fail on later (the manual hotfix that release ea8a3b9 was).
        # Idempotent: a no-op when prose already matches file-system counts.
        run: node plugins/artibot/scripts/ci/sync-readme-claims.js

      - name: Install plugin dependencies (for test count)
        working-directory: plugins/artibot
        # Same reasoning as the validate job's install step: the fallback must
        # keep --ignore-scripts, or an `npm ci` failure quietly re-enables
        # lifecycle scripts on a runner that holds a write-scoped token.
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Count test cases
        # marketplace.json `qualityMetrics.tests` is a test-CASE count, not a
        # file count. Derive it authoritatively from vitest's numTotalTests so a
        # release self-corrects the metric. Informational: a vitest failure here
        # must never block the release (mirrors the validate job's policy), so we
        # fall back to leaving the field unchanged when the count can't be read.
        id: testcount
        continue-on-error: true
        working-directory: plugins/artibot
        run: |
          mkdir -p runtime
          npx vitest run --reporter=json --outputFile=runtime/vitest-report.json || true
          TESTS=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('runtime/vitest-report.json','utf-8')).numTotalTests||'')}catch{console.log('')}")
          echo "tests=${TESTS}" >> "$GITHUB_OUTPUT"
          echo "Counted test cases: ${TESTS:-<unavailable>}"

      - name: Sync marketplace.json metadata
        # Self-heal marketplace.json version / release.current / qualityMetrics.tests
        # so a release never leaves these stale (audit 2026-06-05 found all three
        # behind). Pulls version from plugin.json; tests from the count above when
        # available, otherwise leaves the field untouched (never fabricated).
        # Idempotent: a no-op when already in sync.
        env:
          TESTS: ${{ steps.testcount.outputs.tests }}
        run: |
          if [ -n "${TESTS}" ]; then
            node plugins/artibot/scripts/ci/sync-marketplace-meta.mjs --tests="${TESTS}"
          else
            node plugins/artibot/scripts/ci/sync-marketplace-meta.mjs
          fi

      # ── Landing strategy ───────────────────────────────────────────────────
      # There are two ways to get the badge commit onto a protected master, and
      # which one is usable depends on whether a PAT is configured:
      #
      #   mode=ff  — `secrets.ARTIBOT_LANDING_PAT` is present.
      #     Push to `ci/sync-badges-<tag>`, wait for the required contexts to go
      #     green on that SHA, then fast-forward master onto it. This is the
      #     side-branch gate flow documented in CONTRIBUTING.md "Landing changes
      #     on master", and `ci/**` is already in the push-branch list of both
      #     required-check workflows. It needs a PAT for exactly the reason the
      #     PR path's comment records below: a push authenticated with
      #     GITHUB_TOKEN does not trigger workflow runs, so the required check
      #     runs would never be created and the branch could never go green.
      #
      #   mode=pr  — no PAT. Current behaviour, unchanged: open a PR, enable
      #     auto-merge, and additionally run the stall detector below.
      #
      # Creating the PAT is a USER ACTION and is deliberately out of scope here:
      # add a fine-grained PAT with `contents: write` on this repo as the
      # `ARTIBOT_LANDING_PAT` secret. Until someone does, mode=pr is selected and
      # nothing about the existing release behaviour changes.
      - name: Decide landing strategy
        id: strategy
        env:
          # `secrets` is not available in step `if:` conditions, so the presence
          # test is evaluated into an env var here and re-exported as an output.
          HAS_PAT: ${{ secrets.ARTIBOT_LANDING_PAT != '' }}
        run: |
          # Change detection moved here from the landing step so both paths share
          # a single answer. Same file set, same semantics as before: no diff
          # means nothing to land and both landing steps skip.
          #
          # Include root .claude-plugin/marketplace.json — it is the Claude
          # Code marketplace routing file and drifted to 4.13.1 vs plugin.json
          # 4.19.6 (incident 2026-06-08) because nothing wrote to it. The
          # sync-marketplace-meta.mjs step above now updates both files.
          if git diff --quiet README.md plugins/artibot/README.md plugins/artibot/marketplace.json .claude-plugin/marketplace.json; then
            echo "No README / marketplace changes to land."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"

            # Name only the halves that actually changed. The subject used to be
            # a fixed string asserting both. Three consecutive releases
            # (572e9d19, #106, #108) touched marketplace.json alone and still
            # announced "README badges", which sends a reader hunting for a
            # README diff that is not in the commit. Built here rather than in
            # the landing steps for the same reason the change detection lives
            # here: both paths must give one answer.
            readme_changed=false
            marketplace_changed=false
            git diff --quiet README.md plugins/artibot/README.md || readme_changed=true
            git diff --quiet plugins/artibot/marketplace.json .claude-plugin/marketplace.json || marketplace_changed=true

            if [ "${readme_changed}" = "true" ] && [ "${marketplace_changed}" = "true" ]; then
              parts="README badges + marketplace meta"
            elif [ "${readme_changed}" = "true" ]; then
              parts="README badges"
            else
              # Reached only when the READMEs are clean, and this whole branch
              # runs only when at least one of the four files differs — so the
              # marketplace half is what changed. Not a default.
              parts="marketplace meta"
            fi
            echo "subject=docs(release): sync ${parts} to ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "Commit subject: docs(release): sync ${parts} to ${GITHUB_REF_NAME}"
          fi
          if [ "${HAS_PAT}" = "true" ]; then
            echo "mode=ff" >> "$GITHUB_OUTPUT"
            echo "Landing mode: ff (ARTIBOT_LANDING_PAT present — ci/** side-branch gate)"
          else
            echo "mode=pr" >> "$GITHUB_OUTPUT"
            echo "Landing mode: pr (no ARTIBOT_LANDING_PAT — PR + auto-merge + stall detector)"
          fi

      - name: Land badge sync via ci/** side branch (PAT)
        if: steps.strategy.outputs.changed == 'true' && steps.strategy.outputs.mode == 'ff'
        env:
          # The PAT is needed for exactly one thing: authenticating the push, so
          # that the resulting workflow runs are attributed to a real user and
          # therefore actually get created. Every `gh` call below deliberately
          # uses GITHUB_TOKEN instead — a fine-grained PAT scoped to
          # `contents: write` has no issues or checks access, so routing the
          # escalation through it would reintroduce the silent failure this
          # whole step exists to remove.
          #
          # PAT expiry is the expected long-run failure of this path: fine-grained
          # PATs expire, and when this one does every `git` call against REMOTE
          # below fails with exit 128. Under `bash -e` that would kill the step
          # with a red X and no issue, i.e. the badge sync would stop landing and
          # the only trace would be a failed step nobody is watching. Every git
          # call is therefore wrapped and routed to open_issue.
          LANDING_PAT: ${{ secrets.ARTIBOT_LANDING_PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BADGE_SUBJECT: ${{ steps.strategy.outputs.subject }}
        run: |
          # Defence in depth for the one env this step cannot work without.
          # An unset/empty prefix does not fail — it makes BRANCH equal to
          # GITHUB_REF_NAME, i.e. `git checkout -b v4.50.0` and a push creating
          # a branch with the SAME NAME AS THE TAG, with the step still green.
          # `${x:?}` exits the shell on the spot, so this cannot reach
          # open_issue (defined below). Deliberate: a top-level env literal can
          # only become unset by editing this file, and
          # tests/firewall/badge-stall-issue-lifecycle.test.js pins the exact
          # env name set, so that edit is already RED at PR time. The
          # notification for the residual case is the red step itself.
          : "${FF_BRANCH_PREFIX:?}"
          git --version
          BRANCH="${FF_BRANCH_PREFIX}${GITHUB_REF_NAME}"
          # Fall back to the both-halves wording only if the strategy step
          # somehow produced no subject. An empty -m aborts the commit, which
          # would turn a naming nit into a failed landing.
          SUBJECT="${BADGE_SUBJECT:-docs(release): sync README badges + marketplace meta to ${GITHUB_REF_NAME}}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add README.md plugins/artibot/README.md plugins/artibot/marketplace.json .claude-plugin/marketplace.json
          git commit -m "${SUBJECT}"

          # Push with the PAT explicitly instead of the GITHUB_TOKEN credential
          # that actions/checkout persisted. The credential is inlined in the
          # remote URL rather than base64-encoded into an http.extraheader
          # because Actions' log scrubbing masks the raw secret value wherever it
          # appears — including inside a URL — but does NOT mask a base64
          # encoding of it.
          REMOTE="https://x-access-token:${LANDING_PAT}@github.com/${GITHUB_REPOSITORY}.git"

          # Open a tracking issue, skipping when one with the same title is
          # already open. No --label: this repo carries only the nine default
          # GitHub labels (measured 2026-08-15 via `gh label list`), and
          # `gh issue create` fails outright when handed a label that does not
          # exist. The previous escalation passed `--label automation,release`,
          # neither of which exists here — a second, independent reason it could
          # never have worked, on top of the missing `issues: write`.
          open_issue() {
            issue_title="$1"
            issue_body="$2"
            existing="$(gh issue list --state open --limit 100 --json title \
              | jq --arg t "${issue_title}" '[.[] | select(.title == $t)] | length' 2>/dev/null || echo 0)"
            # An empty value must mean "none found", not "skip the escalation".
            existing="${existing:-0}"
            if [ "${existing}" != "0" ]; then
              echo "::warning::Escalation issue already open, not duplicating: ${issue_title}"
              return 0
            fi
            gh issue create --title "${issue_title}" --body "${issue_body}" \
              || echo "::warning::Could not open escalation issue: ${issue_title}"
          }

          # Wait until every check run on a SHA has completed successfully.
          #
          # Deliberately does NOT mirror the four required context names. Three
          # copies of that list already exist (branch protection itself, the
          # firewall test's REQUIRED_CONTEXTS, the pre-push hook) and a fourth
          # would be one more thing to drift. Instead this waits for all checks
          # to be green and then simply attempts the push — branch protection is
          # the authority on what is required, and it rejects the push if the
          # set is not satisfied.
          #
          # 40 attempts x 15s = 10 min ceiling. Measured 2026-08-15 on PR #100:
          # the Node matrix took 3m33s wall and the plugin.json contexts 4s, so
          # the ceiling is roughly 3x the observed worst case.
          wait_for_green() {
            target_sha="$1"
            for _ in $(seq 1 40); do
              sleep 15
              payload="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${target_sha}/check-runs" 2>/dev/null || echo '')"
              # `if`, not `[ ... ] && continue`: the default shell is `bash -e`,
              # where a bare short-circuit list that evaluates false is a failing
              # final command and aborts the whole step.
              if [ -z "${payload}" ]; then continue; fi
              total="$(printf '%s' "${payload}" | jq -r '.total_count' 2>/dev/null || echo 0)"
              if [ "${total}" = "0" ]; then continue; fi
              pending="$(printf '%s' "${payload}" | jq -r '[.check_runs[] | select(.status != "completed")] | length' 2>/dev/null || echo 1)"
              failed="$(printf '%s' "${payload}" | jq -r '[.check_runs[] | select(.conclusion != null) | select([.conclusion] | inside(["success","neutral","skipped"]) | not)] | length' 2>/dev/null || echo 0)"
              echo "  ${target_sha}: total=${total} pending=${pending} failed=${failed}"
              if [ "${failed}" != "0" ]; then return 1; fi
              if [ "${pending}" = "0" ]; then return 0; fi
            done
            return 1
          }

          # Assembled from the workflow-level env pair, not written out here, so
          # the self-heal step at the top of this job can find these issues
          # again later and close the ones whose sync did eventually land.
          ISSUE_TITLE="${LAND_TITLE_PREFIX}${GITHUB_REF_NAME}${LAND_TITLE_SUFFIX}"

          if ! git push "${REMOTE}" "HEAD:refs/heads/${BRANCH}"; then
            echo "::warning::Could not push ${BRANCH} — the landing PAT is the usual cause (expired, revoked, or missing contents:write)."
            open_issue "${ISSUE_TITLE}" \
              "Pushing \`${BRANCH}\` (release ${GITHUB_REF_NAME}) failed, so the badge sync never left the runner. The most likely cause is \`ARTIBOT_LANDING_PAT\` being expired, revoked, or lacking \`contents: write\`. Renew the secret, or remove it to fall back to the PR + auto-merge path."
            exit 0
          fi
          SHA="$(git rev-parse HEAD)"
          echo "Pushed ${BRANCH} @ ${SHA}"

          if ! wait_for_green "${SHA}"; then
            echo "::warning::Checks on ${BRANCH} @ ${SHA} did not go green within the wait window."
            open_issue "${ISSUE_TITLE}" \
              "Branch \`${BRANCH}\` (release ${GITHUB_REF_NAME}) did not reach a green required-check state at \`${SHA}\`, so master was not fast-forwarded. The badge + marketplace changes are on the branch and need a human to land or discard them."
            exit 0
          fi

          # A plain (non-force) push to master is fast-forward-only by
          # definition, so no extra flag is needed — git rejects it if master has
          # moved. That rejection is the R5 race: the tag points at the released
          # commit, and master can advance after the tag. Handle it by rebasing
          # onto the new master, re-greening, and retrying exactly once.
          if git push "${REMOTE}" "HEAD:refs/heads/master"; then
            echo "Fast-forwarded master onto ${BRANCH} @ ${SHA}"
            exit 0
          fi

          echo "::warning::master moved since the tag — rebasing ${BRANCH} and retrying once."
          if ! git fetch "${REMOTE}" master; then
            echo "::warning::Could not fetch master to rebase onto (landing PAT expired or revoked?)."
            open_issue "${ISSUE_TITLE}" \
              "\`${BRANCH}\` (release ${GITHUB_REF_NAME}) could not be fast-forwarded onto master and the follow-up fetch also failed, so no retry was possible. Check whether \`ARTIBOT_LANDING_PAT\` is still valid. The badge changes are on the branch and need a human to land or discard them."
            exit 0
          fi
          if ! git rebase FETCH_HEAD; then
            git rebase --abort || true
            echo "::warning::Rebase of ${BRANCH} onto master conflicted."
            open_issue "${ISSUE_TITLE}" \
              "Branch \`${BRANCH}\` (release ${GITHUB_REF_NAME}) could not be rebased onto master without conflicts, so the badge sync was not landed. Needs manual resolution."
            exit 0
          fi
          if ! git push --force-with-lease "${REMOTE}" "HEAD:refs/heads/${BRANCH}"; then
            echo "::warning::Could not push the rebased ${BRANCH} (stale lease, or landing PAT expired)."
            open_issue "${ISSUE_TITLE}" \
              "The rebased \`${BRANCH}\` (release ${GITHUB_REF_NAME}) could not be pushed, so the retry was abandoned. Either another writer moved the branch (\`--force-with-lease\` refused) or \`ARTIBOT_LANDING_PAT\` is no longer valid."
            exit 0
          fi
          SHA_RETRY="$(git rev-parse HEAD)"
          echo "Rebased ${BRANCH} @ ${SHA_RETRY}"
          if wait_for_green "${SHA_RETRY}" && git push "${REMOTE}" "HEAD:refs/heads/master"; then
            echo "Fast-forwarded master onto ${BRANCH} @ ${SHA_RETRY} after rebase"
            exit 0
          fi
          echo "::warning::Retry after rebase still could not land ${BRANCH} on master."
          open_issue "${ISSUE_TITLE}" \
            "Branch \`${BRANCH}\` (release ${GITHUB_REF_NAME}) failed to land on master even after one rebase retry (head \`${SHA_RETRY}\`). Needs a human to land or discard it."

      - name: Land badge sync via PR + auto-merge
        id: badge_pr
        if: steps.strategy.outputs.changed == 'true' && steps.strategy.outputs.mode == 'pr'
        # Previous flow pushed directly to master with the default GITHUB_TOKEN.
        # Branch protection requires PR + required status checks, which blocked
        # every recent release's badge sync. Switching to a PR via the gh CLI:
        # tokens authored by GITHUB_TOKEN appear as github-actions[bot] and
        # cannot bypass protection, so the PR is the supported path. Auto-merge
        # is enabled so badges flow without manual intervention once required
        # checks pass.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.counts.outputs.version }}
          BADGE_SUBJECT: ${{ steps.strategy.outputs.subject }}
        run: |
          # Same dedup + no-label rationale as the ff path's copy above. Defined
          # here too because steps cannot share shell functions.
          open_issue() {
            issue_title="$1"
            issue_body="$2"
            existing="$(gh issue list --state open --limit 100 --json title \
              | jq --arg t "${issue_title}" '[.[] | select(.title == $t)] | length' 2>/dev/null || echo 0)"
            # An empty value must mean "none found", not "skip the escalation".
            existing="${existing:-0}"
            if [ "${existing}" != "0" ]; then
              echo "::warning::Escalation issue already open, not duplicating: ${issue_title}"
              return 0
            fi
            gh issue create --title "${issue_title}" --body "${issue_body}" \
              || echo "::warning::Could not open escalation issue: ${issue_title}"
          }

          # Same unset-env guard, same rationale as the ff path's copy above.
          : "${PR_BRANCH_PREFIX:?}"
          BRANCH="${PR_BRANCH_PREFIX}${GITHUB_REF_NAME}"
          # Same fallback rationale as the ff path: an empty -m aborts the commit.
          SUBJECT="${BADGE_SUBJECT:-docs(release): sync README badges + marketplace meta to ${GITHUB_REF_NAME}}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add README.md plugins/artibot/README.md plugins/artibot/marketplace.json .claude-plugin/marketplace.json
          # No [skip ci] — the badge PR needs required CI checks to run so
          # auto-merge can proceed. Adding [skip ci] would block both the push
          # AND pull_request triggers, leaving the PR permanently BLOCKED.
          git commit -m "${SUBJECT}"
          # Guarded for the same reason as the ff path's pushes: a bare command
          # under `bash -e` kills the step with a red X and no issue. The
          # realistic trigger here is re-tagging — pushing v1.2.3 twice leaves a
          # branch of that name already on the remote, and the second push is
          # rejected as non-fast-forward.
          if ! git push origin "${BRANCH}"; then
            echo "::warning::Could not push ${BRANCH} — a branch of that name likely already exists on the remote (re-tagged release?)."
            open_issue "${PUSH_TITLE_PREFIX}${GITHUB_REF_NAME}${PUSH_TITLE_SUFFIX}" \
              "Pushing \`${BRANCH}\` (release ${GITHUB_REF_NAME}) was rejected, so no badge-sync PR was opened. If this release was re-tagged, delete the stale remote branch and re-run, or land the badge + marketplace changes manually."
            exit 0
          fi
          gh pr create \
            --base master \
            --head "${BRANCH}" \
            --title "${SUBJECT}" \
            --body "Automated badge + marketplace metadata sync triggered by release ${GITHUB_REF_NAME}. Auto-merges once required CI checks pass."
          # P1 escalation: if --auto fails (auto-merge disabled at repo level,
          # required-check misconfig, etc.) the PR previously stayed open
          # indefinitely. Now we open a tracking issue so the human can act.
          # The `--label automation,release` this call used to pass was removed:
          # neither label exists in this repo and `gh issue create` fails on an
          # unknown label, so the escalation could not have succeeded even with
          # the `issues: write` permission now granted above.
          AUTOMERGE_ENABLED=true
          if ! gh pr merge --auto --squash --delete-branch "${BRANCH}"; then
            AUTOMERGE_ENABLED=false
            echo "::warning::Auto-merge could not be enabled for ${BRANCH} — opening tracking issue."
            open_issue "${MERGE_TITLE_PREFIX}${GITHUB_REF_NAME}${MERGE_TITLE_SUFFIX}" \
              "Auto-merge was not enabled on \`${BRANCH}\` (release ${GITHUB_REF_NAME}). Please review and merge the PR manually so the README badges + marketplace.json reach master."
          fi

          # The detector below answers exactly one question: "auto-merge is
          # enabled — will it ever fire?" That question is meaningless when
          # auto-merge could not be enabled at all, and the escalation just above
          # has already reported that case. Gating the detector on
          # AUTOMERGE_ENABLED keeps one release from producing both a "needs
          # manual merge" and an "is stalled" issue for the same branch.
          #
          # head_sha is the PR HEAD, not the tag sha: the tag points at the
          # commit that was released and this commit is one ahead of it, so
          # querying the tag sha would make the detector permanently wrong in
          # both directions.
          {
            echo "branch=${BRANCH}"
            echo "head_sha=$(git rev-parse HEAD)"
            echo "automerge_enabled=${AUTOMERGE_ENABLED}"
          } >> "$GITHUB_OUTPUT"

      # ── Stall detector ─────────────────────────────────────────────────────
      # Enabling auto-merge is not the same as auto-merge working. Between
      # v4.38.0 and v4.45.0 six badge PRs (#94 #95 #96 #98 #99 #100) sat open for
      # four months with auto-merge enabled and no signal reaching anyone. The
      # escalation in the step above only fires when `gh pr merge --auto` FAILS,
      # and it succeeded every time — the stall was one step later, waiting on
      # required checks that were never created.
      #
      # Two distinct silent modes were measured on 2026-08-15:
      #   1. no runs at all — #94/#95/#96 (v4.38.0/v4.39.0/v4.40.0):
      #      `actions/runs?branch=...` returned total_count 0 for all three.
      #   2. runs created but gated on manual approval — #98/#99/#100:
      #      conclusion `action_required`, triggering_actor github-actions[bot].
      #
      # Mode 2 does not appear in `commits/<sha>/check-runs` at all. On PR #100's
      # original head 625f5cc3 that endpoint returned total_count 0 while
      # `gh run list` showed two `action_required` runs on the same branch. So
      # both a check-runs query and a workflow-runs query are needed: looking
      # only at check-runs would reach the right verdict for the wrong reason,
      # and looking for `action_required` *inside* check-runs would never match
      # anything at all.
      #
      # Honest limit on the mode-2 arm: it could not be replayed against live
      # data. Updating PR #100 to land it caused GitHub to delete those
      # approval-gated runs (the run ids now 404), destroying the only fixture.
      # The check-runs arm below WAS replayed against both real SHAs on
      # 2026-08-15 and returned the correct verdict for each (625f5cc3 -> 0 ->
      # escalate; 1a7f9e19 -> 6 -> quiet). The mode-2 arm is unproven until a
      # release actually stalls that way again.
      #
      # 6 attempts x 20s = 2 min ceiling, exiting early on the first definite
      # answer. The question here is only "were checks created", not "did they
      # pass" — creation was observed within ~8s on PR #100 — so the window does
      # not need to cover the ~3m30s the Node matrix takes to finish.
      - name: Detect silent badge-sync stall
        if: steps.badge_pr.outputs.automerge_enabled == 'true'
        # The release is already published by the time this runs, so a detector
        # bug must never fail it. But a swallowed failure is precisely the
        # silence this step exists to remove: every exit path emits a
        # ::warning:: annotation, which surfaces on the run summary rather than
        # only in the step log.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.badge_pr.outputs.branch }}
          HEAD_SHA: ${{ steps.badge_pr.outputs.head_sha }}
        run: |
          # Same dedup + no-label rationale as the ff path's copy above.
          open_issue() {
            issue_title="$1"
            issue_body="$2"
            existing="$(gh issue list --state open --limit 100 --json title \
              | jq --arg t "${issue_title}" '[.[] | select(.title == $t)] | length' 2>/dev/null || echo 0)"
            # An empty value must mean "none found", not "skip the escalation".
            existing="${existing:-0}"
            if [ "${existing}" != "0" ]; then
              echo "::warning::Escalation issue already open, not duplicating: ${issue_title}"
              return 0
            fi
            gh issue create --title "${issue_title}" --body "${issue_body}" \
              || echo "::warning::Could not open escalation issue: ${issue_title}"
          }

          # A failed query and a genuine zero must never collapse to the same
          # value. `... || echo 0` did exactly that: an API error would have been
          # reported as "no checks exist", which is the same class of
          # unobservable silent failure this whole step exists to remove. Each
          # query now records whether it ever succeeded, every failure emits a
          # ::warning::, and the "all clear" verdict is only reachable when the
          # queries actually answered.
          # stderr is captured to a file rather than merged with `2>&1`. Merging
          # puts any gh warning (deprecation notices, auth hints) into the value
          # itself, so a query that SUCCEEDED could yield a non-numeric string
          # and then blow up the `-ge` comparison below under `bash -e`. Keeping
          # the streams apart means the value is only ever gh's stdout, while the
          # diagnostic text stays available for the warning message.
          ERR_LOG="$(mktemp)"
          err_text() { tr '\n' ' ' < "${ERR_LOG}" | cut -c1-300; }

          # Each query below additionally accepts its result only when it is a
          # number. A zero exit code is not evidence that the payload parsed, and
          # treating unparseable output as data is how a detector starts
          # reporting confident nonsense. A non-numeric result leaves
          # *_QUERY_OK false, so the verdict lands in the "inconclusive" branch
          # rather than in a wrong diagnosis.

          CHECKS=0
          APPROVAL=0
          CHECKS_QUERY_OK=false
          APPROVAL_QUERY_OK=false
          for attempt in $(seq 1 6); do
            sleep 20
            if CHECKS_RAW="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs" \
              --jq '.total_count' 2>"${ERR_LOG}")"; then
              case "${CHECKS_RAW}" in
                ''|*[!0-9]*)
                  echo "::warning::check-runs query for ${HEAD_SHA} returned non-numeric output: '${CHECKS_RAW}'"
                  CHECKS=0 ;;
                *)
                  CHECKS="${CHECKS_RAW}"
                  CHECKS_QUERY_OK=true ;;
              esac
            else
              echo "::warning::check-runs query failed for ${HEAD_SHA}: $(err_text)"
              CHECKS=0
            fi
            # Queried by branch AND by head_sha, taking whichever is larger.
            # The branch form is the one directly observed to surface
            # approval-gated runs (2026-08-15, `?branch=chore/sync-readme-badges-*`);
            # the head_sha form is kept because `pull_request` runs in this repo
            # do key head_sha to the PR head commit rather than to a synthetic
            # merge commit (verified on the surviving runs for 1a7f9e19). The
            # branch is created fresh in the step above and is unique per tag,
            # so it cannot pick up unrelated runs.
            APPROVAL_FILTER='[.workflow_runs[] | select(.conclusion == "action_required" or .status == "action_required")] | length'
            APPROVAL_BRANCH=0
            APPROVAL_SHA=0
            if APPROVAL_BRANCH_RAW="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${BRANCH}" \
              --jq "${APPROVAL_FILTER}" 2>"${ERR_LOG}")"; then
              case "${APPROVAL_BRANCH_RAW}" in
                ''|*[!0-9]*)
                  echo "::warning::actions/runs query by branch returned non-numeric output: '${APPROVAL_BRANCH_RAW}'" ;;
                *)
                  APPROVAL_BRANCH="${APPROVAL_BRANCH_RAW}"
                  APPROVAL_QUERY_OK=true ;;
              esac
            else
              echo "::warning::actions/runs query by branch failed for ${BRANCH}: $(err_text)"
            fi
            if APPROVAL_SHA_RAW="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}" \
              --jq "${APPROVAL_FILTER}" 2>"${ERR_LOG}")"; then
              case "${APPROVAL_SHA_RAW}" in
                ''|*[!0-9]*)
                  echo "::warning::actions/runs query by head_sha returned non-numeric output: '${APPROVAL_SHA_RAW}'" ;;
                *)
                  APPROVAL_SHA="${APPROVAL_SHA_RAW}"
                  APPROVAL_QUERY_OK=true ;;
              esac
            else
              echo "::warning::actions/runs query by head_sha failed for ${HEAD_SHA}: $(err_text)"
            fi
            # Normalise: a successful query returning nothing leaves the var
            # empty, and `-ge` on an empty string is a fatal error under `-e`.
            CHECKS="${CHECKS:-0}"
            APPROVAL_BRANCH="${APPROVAL_BRANCH:-0}"
            APPROVAL_SHA="${APPROVAL_SHA:-0}"
            if [ "${APPROVAL_BRANCH}" -ge "${APPROVAL_SHA}" ]; then
              APPROVAL="${APPROVAL_BRANCH}"
            else
              APPROVAL="${APPROVAL_SHA}"
            fi
            echo "attempt ${attempt}: check_runs=${CHECKS} approval_gated=${APPROVAL} (branch=${APPROVAL_BRANCH} sha=${APPROVAL_SHA})"
            # `if`, not `[ ... ] && break`: the default shell is `bash -e`, where
            # a bare short-circuit list that evaluates false is a failing final
            # command and aborts the whole step.
            if [ "${APPROVAL}" != "0" ]; then break; fi
            if [ "${CHECKS}" != "0" ]; then break; fi
          done

          # Assembled from the workflow-level env pair, not written out here, so
          # the self-heal step in this job can find these issues again later.
          ISSUE_TITLE="${STALL_TITLE_PREFIX}${GITHUB_REF_NAME}${STALL_TITLE_SUFFIX}"

          if [ "${APPROVAL}" != "0" ]; then
            echo "::warning::${APPROVAL} workflow run(s) for ${HEAD_SHA} are waiting for manual approval — auto-merge on ${BRANCH} will never complete."
            open_issue "${ISSUE_TITLE}" \
              "Branch \`${BRANCH}\` (release ${GITHUB_REF_NAME}, head \`${HEAD_SHA}\`) has ${APPROVAL} workflow run(s) in \`action_required\` state, i.e. queued behind a manual approval. Auto-merge is enabled but can never complete, because approval-gated runs do not produce check runs on the commit. Approve the runs in the Actions tab, or land the badge sync another way. Setting the \`ARTIBOT_LANDING_PAT\` secret switches this workflow to the ci/** side-branch gate and avoids the approval gate entirely."
          elif [ "${CHECKS_QUERY_OK}" != "true" ] || [ "${APPROVAL_QUERY_OK}" != "true" ]; then
            # Ordered BEFORE the `CHECKS = 0` branch on purpose. A query that
            # never answered leaves CHECKS at its 0 initialiser, so testing for
            # zero first would diagnose a permission or outage problem as "no
            # check runs exist" and file an issue saying so — a confidently
            # wrong diagnosis, which is worse than the silence being fixed here.
            # No issue is opened: a query outage is not evidence of a stall. But
            # the run must not look clean either.
            echo "::warning::Stall detection was inconclusive for ${BRANCH} @ ${HEAD_SHA} (check-runs query ok=${CHECKS_QUERY_OK}, actions/runs query ok=${APPROVAL_QUERY_OK}). Verify the badge PR merged before assuming it did."
          elif [ "${CHECKS}" = "0" ]; then
            echo "::warning::No check runs were created for ${HEAD_SHA} — auto-merge on ${BRANCH} will never complete."
            open_issue "${ISSUE_TITLE}" \
              "Branch \`${BRANCH}\` (release ${GITHUB_REF_NAME}, head \`${HEAD_SHA}\`) has no check runs at all, so the required status checks can never be satisfied and auto-merge will wait forever. This is the failure mode that left six badge PRs open from v4.38.0 to v4.45.0. Land the badge sync manually, or set the \`ARTIBOT_LANDING_PAT\` secret to switch this workflow to the ci/** side-branch gate."
          else
            echo "Badge-sync PR on ${BRANCH}: ${CHECKS} check run(s) created for ${HEAD_SHA} — auto-merge can proceed."
          fi
