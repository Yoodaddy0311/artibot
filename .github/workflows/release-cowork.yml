name: Release Cowork

on:
  push:
    tags:
      - "cowork-v*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate before cowork release
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: plugins/artibot-cowork

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # Rule coverage for these scripts lives in ci.yml, via
      # plugins/artibot/tests/firewall/cowork-scripts-lint.test.js. That job runs
      # on push/PR to master and the release branch prefixes — it does NOT run on
      # a `cowork-v*` tag push, which is the event that gates this workflow. So a
      # tag pushed from a branch that never saw CI would publish unparsed code.
      # This step is that floor. It is syntax only; it does not replace the gate.
      #
      # `node --check` is FAIL-OPEN on a `.js` file whose nearest package.json
      # declares no `type`: Node falls back to syntax detection and exits 0 with
      # no output on a broken ESM file (measured 2026-08-15, Node 22.19.0). It
      # works here only because the repo-root package.json declares
      # `"type": "module"`. The count assertion is what stops the step from
      # reporting success after examining nothing, which is the failure mode that
      # left these scripts unchecked in the first place.
      - name: Syntax-check release scripts
        run: |
          count=0
          for f in scripts/*.js; do
            node --check "$f"
            count=$((count + 1))
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::No scripts/*.js matched — nothing was syntax-checked."
            exit 1
          fi
          echo "Syntax-checked $count script(s)."

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#cowork-v}"
          PLUGIN_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json','utf-8')).version)")
          if [ "$TAG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match plugin.json version ($PLUGIN_VERSION)"
            exit 1
          fi
          echo "Version verified: $TAG_VERSION"

      - name: Verify CHANGELOG entry exists
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#cowork-v}"
          if ! grep -q "^## \[${TAG_VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md missing entry for [${TAG_VERSION}]"
            exit 1
          fi
          echo "CHANGELOG entry found for ${TAG_VERSION}"

      - name: Validate plugin.json schema
        run: |
          node -e "
          const fs = require('fs');
          const plugin = JSON.parse(fs.readFileSync('.claude-plugin/plugin.json', 'utf-8'));
          const required = ['name', 'version', 'description'];
          let errors = 0;
          for (const field of required) {
            if (!plugin[field]) { console.error('FAIL: missing', field); errors++; }
          }
          const semver = /^\d+\.\d+\.\d+(-[\w.]+)?$/;
          if (plugin.version && !semver.test(plugin.version)) {
            console.error('FAIL: invalid version', plugin.version); errors++;
          }
          if (errors > 0) process.exit(1);
          console.log('PASS:', plugin.name, plugin.version);
          "

      - name: Validate skills directory structure
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const skillsDir = 'skills';
          if (!fs.existsSync(skillsDir)) { process.exit(0); }
          const dirs = fs.readdirSync(skillsDir).filter(e =>
            fs.statSync(path.join(skillsDir, e)).isDirectory()
          );
          let errors = 0;
          for (const dir of dirs) {
            const skillMd = path.join(skillsDir, dir, 'SKILL.md');
            if (!fs.existsSync(skillMd)) {
              console.error('FAIL:', dir, 'missing SKILL.md');
              errors++;
            }
          }
          if (errors > 0) process.exit(1);
          console.log('All', dirs.length, 'skill directories valid.');
          "

      - name: Validate commands frontmatter
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const cmdsDir = 'commands';
          if (!fs.existsSync(cmdsDir)) { process.exit(0); }
          const files = fs.readdirSync(cmdsDir).filter(f => f.endsWith('.md'));
          let errors = 0;
          for (const file of files) {
            const content = fs.readFileSync(path.join(cmdsDir, file), 'utf-8');
            if (!/^---\r?\n[\s\S]*?\r?\n---/.test(content)) {
              console.error('FAIL:', file, 'missing frontmatter');
              errors++;
            }
          }
          if (errors > 0) process.exit(1);
          console.log('All', files.length, 'command files valid.');
          "

  release:
    name: Create GitHub Release (cowork)
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract changelog section
        id: changelog
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#cowork-v}"
          CHANGELOG_FILE="plugins/artibot-cowork/CHANGELOG.md"

          # Extract section between ## [VERSION] and the next ## [
          SECTION=$(awk -v ver="$TAG_VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' "$CHANGELOG_FILE")

          if [ -z "$SECTION" ]; then
            SECTION="See CHANGELOG.md for details."
          fi

          {
            echo "changes<<CHANGES_EOF"
            echo "$SECTION"
            echo "CHANGES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Artibot Cowork ${{ github.ref_name }}
          body: |
            ## Artibot Cowork ${{ github.ref_name }}

            ${{ steps.changelog.outputs.changes }}

            ---
            *Cowork-optimized slim build of Artibot — marketing, content, data, design skills for knowledge workers using Claude Cowork.*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}

  # NOTE on qualityMetrics sync: the cowork build does NOT carry its own
  # qualityMetrics.tests counter (cowork plugin.json has no qualityMetrics
  # block — verified 2026-06-08). The root .claude-plugin/marketplace.json
  # `plugins[name=artibot-cowork].version` field IS the only cross-file
  # lockstep target, and it is kept in sync by the operator bumping the same
  # version field in both plugins/artibot-cowork/.claude-plugin/plugin.json
  # AND .claude-plugin/marketplace.json before tagging cowork-vX.Y.Z.
  # release-check.js does not currently watch the cowork lockstep; a future
  # extension could add it, but for now this comment is the canonical
  # documentation of why no auto-sync step lives here.
