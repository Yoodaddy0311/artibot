# NOTE: This CI is the primary workflow. The duplicate at plugins/artibot/.github/workflows/ci.yml
# is kept for standalone plugin development but may be removed in a future cleanup.
name: CI

on:
  push:
    branches: [master, main, "artibot/**"]
  pull_request:
    branches: [master, main, "artibot/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22, 24]

    defaults:
      run:
        working-directory: plugins/artibot

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: plugins/artibot/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts || npm install

      - name: Validate agents
        run: node scripts/ci/validate-agents.js

      - name: Validate skills
        run: node scripts/ci/validate-skills.js

      - name: Validate commands
        run: node scripts/ci/validate-commands.js

      - name: Validate hooks
        run: node scripts/ci/validate-hooks.js

      - name: Run tests with coverage
        run: |
          if [ -d "tests" ] || [ -d "__tests__" ] || [ -d "test" ]; then
            npx vitest run --reporter=verbose --coverage
          else
            echo "No test directory found. Skipping tests."
          fi

      - name: Validate coverage thresholds
        run: node scripts/ci/validate-coverage.js --check

      - name: Run runtime eval gate
        run: npm run eval:runtime:check

      - name: Publish runtime eval summary
        if: always()
        run: node scripts/ci/publish-runtime-eval-summary.js

      - name: Upload runtime eval artifacts
        if: always() && matrix.node-version == 22
        uses: actions/upload-artifact@v5
        with:
          name: runtime-evals-node-${{ matrix.node-version }}
          path: |
            plugins/artibot/_reports/runtime-task-suite.json
            plugins/artibot/_reports/runtime-eval-comparison.json
            _benchmarks/runtime-eval-comparison.md
          if-no-files-found: warn

      - name: Upload coverage report
        if: always() && matrix.node-version == 22
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report-node-${{ matrix.node-version }}
          path: |
            plugins/artibot/coverage/coverage-summary.json
            plugins/artibot/coverage/lcov.info
          if-no-files-found: warn

      - name: Run ESLint
        run: |
          if [ -f ".eslintrc.json" ] || [ -f ".eslintrc.js" ] || [ -f ".eslintrc.yml" ] || [ -f "eslint.config.js" ] || [ -f "eslint.config.mjs" ]; then
            npx eslint . --max-warnings=0
          else
            echo "No ESLint config found. Skipping lint."
          fi
