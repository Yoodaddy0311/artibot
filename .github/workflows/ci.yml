# NOTE: This CI is the primary workflow. The duplicate at plugins/artibot/.github/workflows/ci.yml
# is kept for standalone plugin development but may be removed in a future cleanup.
name: CI

on:
  # `ci/**` is the staging prefix for the side-branch gate flow: push there
  # first, wait for the four required contexts to go green on that SHA, then
  # fast-forward master. Check runs attach to the SHA, so master's required
  # checks are already satisfied when it moves and the push needs no bypass.
  # See CONTRIBUTING.md "Landing changes on master".
  push:
    branches: [master, main, "artibot/**", "ci/**"]
  pull_request:
    branches: [master, main, "artibot/**"]
  workflow_dispatch:

permissions:
  contents: read

# Force JavaScript actions onto Node 24 ahead of GitHub's 2026-06-02 default switch.
# Suppresses the Node 20 deprecation annotation emitted by older action versions.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate:
    # `matrix.os-label` is deliberately absent from the matrix vectors below and
    # set only on the Windows include entry, so it expands to the empty string
    # on the three Linux legs and leaves their names byte-identical:
    # "Validate (Node 20|22|24)". Two of those are required contexts in master's
    # branch protection (measured 2026-08-18: "Validate (Node 22)",
    # "Validate (Node 24)", plus the two plugin-structure contexts) — renaming
    # them would silently unsatisfy branch protection. Because this job sets
    # `name:` explicitly, GitHub does NOT append matrix values to it, which is
    # what makes adding an `os` dimension safe here; it is also why the Windows
    # leg needs an explicit suffix, or it would collide on the same check name.
    name: Validate (Node ${{ matrix.node-version }})${{ matrix.os-label }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # Single-value dimension on purpose: it does not multiply the matrix,
        # but it makes `os` an *original* matrix key. That is load-bearing —
        # an `include:` entry only creates a new combination when it cannot be
        # merged into an existing one, and merging is blocked only by a
        # conflicting original key. With `os` here, `{windows-latest, 22}`
        # conflicts with every ubuntu combination and becomes a 4th job. Drop
        # this line and the same include would instead be absorbed into the
        # existing Node 22 leg, moving it off Linux rather than adding to it.
        os: [ubuntu-latest]
        # Node 20 is the floor (package.json#/engines/node >=20). 22 is the
        # primary LTS gate (uploads coverage + runtime evals). 24 is the
        # forward smoke. Drift detection: keep this list lockstep with
        # plugins/artibot/scripts/install.sh#MIN_NODE_MAJOR (=20).
        node-version: [20, 22, 24]
        include:
          # Windows coverage, one combination. The suite is path- and
          # shell-sensitive in ways Linux legs cannot surface. Node 22 chosen
          # to match the primary LTS gate. This produces the check name
          # "Validate (Node 22) on Windows", which is NOT in branch
          # protection's required list — it is informational until someone
          # adds it deliberately.
          - os: windows-latest
            node-version: 22
            os-label: " on Windows"

    defaults:
      run:
        working-directory: plugins/artibot
        # Windows runners default to pwsh, which is a parse error — not a
        # runtime failure — on the sh syntax these steps use (`||` fallback at
        # :62 below). bash is present on all three runner images, so setting it
        # workflow-wide keeps one step body valid on every leg instead of
        # forking the script per OS.
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          # Cache key derives from the lockfile + extra hashed inputs so that
          # changes to coverage/runtime config trigger a fresh cache. Without
          # this, stale node_modules + a stale vitest binary produced false
          # green runs after `tests/` or `_reports/` schema bumps.
          cache-dependency-path: |
            plugins/artibot/package-lock.json
            plugins/artibot/runtime/**/*.json
            plugins/artibot/_reports/**/*.json

      - name: Install dependencies
        run: npm ci --ignore-scripts || npm install

      - name: Validate agents
        run: node scripts/ci/validate-agents.js

      - name: Validate skills
        run: node scripts/ci/validate-skills.js

      - name: Validate commands
        run: node scripts/ci/validate-commands.js

      - name: Validate hooks
        run: node scripts/ci/validate-hooks.js

      - name: Validate docs
        run: node scripts/ci/validate-doc-links.js && node scripts/ci/validate-md-rendering.js

      # Runs on every event and every matrix leg. The previous split ran
      # structural mode on PRs and --full only on push/Node 22, which left PRs
      # and side-branch pushes on a weaker gate than master. That split bought
      # nothing measurable: --full adds exactly one actual (statementCoverage,
      # scripts/ci/readme-claims-registry.js:95-102) and that key is
      # deliberately excluded from CLAIM_PATTERNS (same file, :110-112), so it
      # is never compared against anything. Measured delta on 2026-08-11 was
      # 422ms structural vs 553ms full, and the two produce byte-identical
      # output apart from the mode banner.
      #
      # Blind spot this step does NOT cover: no coverage claim is verified by
      # any mode today. If a coverage pattern is added to CLAIM_PATTERNS, this
      # step must move below "Run tests with coverage" -- coverage-summary.json
      # does not exist yet at this point in the job, and the registry skips
      # absent actuals silently rather than failing.
      - name: Validate README claims
        run: node scripts/ci/validate-readme-claims.js --full

      # Unconditional on purpose. The `if [ -d "tests" ]` guard this replaces was
      # GitHub starter-template boilerplate — it arrived with the file itself
      # (7a37101d, 2026-02-19), not as an answer to any problem — and its `else`
      # branch echoed "No test directory found. Skipping tests." and exited 0.
      # Renaming or moving `tests/` would therefore have turned the whole test
      # gate GREEN while running zero tests, and every other gate's green would
      # have become meaningless with it.
      #
      # A condition that can silently disable its own gate is worse than no
      # condition, because there is then nothing left to drift. vitest already
      # fails closed here: no matching test files is exit 1 (measured
      # 2026-08-15). That depends on `passWithNoTests` staying unset — it is not
      # set in vitest.config.js or package.json today, and setting it would
      # reopen exactly this hole.
      - name: Run tests with coverage
        run: npx vitest run --reporter=verbose --coverage

      - name: Validate coverage thresholds
        run: node scripts/ci/validate-coverage.js --check

      - name: Run runtime eval gate
        run: npm run eval:runtime:check

      - name: Publish runtime eval summary
        if: always()
        run: node scripts/ci/publish-runtime-eval-summary.js

      # The `matrix.os` half of this condition is not cosmetic. Artifact names
      # are unique per workflow run in upload-artifact v4+ — a second upload of
      # an existing name is a 409, and a failed step fails the job. Adding the
      # Windows leg created a second Node 22 combination, so without this the
      # Windows job would go red on the artifact step alone while every gate
      # above it passed. Restricting to Linux (rather than putting the OS in
      # the artifact name) keeps `runtime-evals-node-22` stable for anything
      # already downloading it.
      - name: Upload runtime eval artifacts
        if: always() && matrix.node-version == 22 && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: runtime-evals-node-${{ matrix.node-version }}
          path: |
            plugins/artibot/_reports/runtime-task-suite.json
            plugins/artibot/_reports/runtime-eval-comparison.json
            _benchmarks/runtime-eval-comparison.md
          if-no-files-found: warn

      # Same 409-on-duplicate-name reason as the step above.
      - name: Upload coverage report
        if: always() && matrix.node-version == 22 && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: coverage-report-node-${{ matrix.node-version }}
          path: |
            plugins/artibot/coverage/coverage-summary.json
            plugins/artibot/coverage/lcov.info
          if-no-files-found: warn

      # Unconditional for the same reason as the test step above. The replaced
      # guard enumerated five config filenames and skipped linting (exit 0) when
      # it matched none — so renaming the config to any name absent from that
      # list, or to a form ESLint supports but the list omits (`eslint.config.ts`,
      # `eslint.config.mts`), would have dropped linting without a word. The
      # enumeration was redundant as well: ESLint 9 resolves `eslint.config.*`
      # itself and fails closed when it finds nothing — exit 2 (measured
      # 2026-08-15). The repo ships `eslint.config.js`.
      #
      # Scope note, unchanged by this edit: the job-level
      # `working-directory: plugins/artibot` means this lints that directory
      # only. Repo-root files and plugins/artibot-cowork/ are NOT linted by CI.
      - name: Run ESLint
        run: npx eslint . --max-warnings=0
