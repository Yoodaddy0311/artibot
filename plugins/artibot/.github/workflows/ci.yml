name: Artibot CI

on:
  push:
    paths:
      - 'plugins/artibot/**'
  pull_request:
    paths:
      - 'plugins/artibot/**'

defaults:
  run:
    working-directory: plugins/artibot

jobs:
  ci:
    name: CI (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18, 20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: plugins/artibot/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate plugin structure
        run: node scripts/validate.js

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Runtime eval gate
        run: npm run eval:runtime:check

      - name: Publish runtime eval summary
        if: always() && matrix.os == 'ubuntu-latest' && matrix.node-version == 20
        run: node scripts/ci/publish-runtime-eval-summary.js

      - name: Upload runtime eval artifacts
        if: always() && matrix.os == 'ubuntu-latest' && matrix.node-version == 20
        uses: actions/upload-artifact@v4
        with:
          name: runtime-evals-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: |
            plugins/artibot/_reports/runtime-task-suite.json
            plugins/artibot/_reports/runtime-eval-comparison.json
            _benchmarks/runtime-eval-comparison.md
          if-no-files-found: warn

      - name: Coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 20
        uses: codecov/codecov-action@v4
        with:
          file: plugins/artibot/coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true
